<div class="dean-office">
  <vs-app-header
    titleKey="DEAN_PLACEHOLDER.TITLE"
    logoIcon="pi pi-building-columns"
    [username]="auth.currentUser()?.full_name ?? null"
    [leftAction]="headerLeftAction"
    [actions]="headerActions"
    (actionClick)="onHeaderAction($event)"
  />

  <main class="dean-office__content">
    <p-card [header]="'DEAN_PLACEHOLDER.OVERVIEW_TITLE' | translate">
      <p>{{ 'DEAN_PLACEHOLDER.OVERVIEW_TEXT' | translate }}</p>
      <p-button [label]="'DEAN_PLACEHOLDER.OPEN_MAIL' | translate" icon="pi pi-envelope" (onClick)="navigateToMail()" />
    </p-card>

    <section class="dean-office__cards">
      <p-card [header]="'DEAN_PLACEHOLDER.CARD_EXPLORE_TITLE' | translate">
        <p>{{ 'DEAN_PLACEHOLDER.CARD_EXPLORE_TEXT' | translate }}</p>
      </p-card>
      <p-card [header]="'DEAN_PLACEHOLDER.CARD_JOIN_DROP_TITLE' | translate">
        <p>{{ 'DEAN_PLACEHOLDER.CARD_JOIN_DROP_TEXT' | translate }}</p>
      </p-card>
      <p-card [header]="'DEAN_PLACEHOLDER.CARD_ADVISING_TITLE' | translate">
        <p>{{ 'DEAN_PLACEHOLDER.CARD_ADVISING_TEXT' | translate }}</p>
      </p-card>
    </section>
  </main>

  <vs-context-chat-bubble
    contextKey="dean-office-help"
    recipientKind="dean_office"
    recipientId="dean.taskford"
    titleKey="CONTEXT_CHAT.DEAN_HELP_TITLE"
  />
</div>
